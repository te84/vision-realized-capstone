<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vision Realized | Owner Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/owner.css" />
    <style>
      :root { --accent: #4a2772; }
    </style>
  </head>
  <body>

    <nav>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="login.html" class="nav-portal">Client Login</a>
      </div>
      <a href="quote.html" class="nav-cta">Start a Quote</a>
    </nav>

    <div class="owner-layout">

      <!-- ── Sidebar ─────────────────────────────────────── -->
      <div class="owner-sidebar">
        <div class="owner-sidebar-title">Owner Dashboard</div>

        <div class="owner-nav-item" id="nav-clients" onclick="showTab('clients')">
          Clients
          <span id="clients-badge"
            style="background:#2e1547;color:white;border-radius:999px;font-size:0.7rem;
                   padding:2px 7px;margin-left:8px;font-family:'DM Sans',sans-serif;">
          </span>
        </div>
        <div class="owner-nav-item" id="nav-calendar" onclick="showTab('calendar')">Calendar</div>
        <div class="owner-nav-item" id="nav-gallery"  onclick="showTab('gallery')">Gallery</div>
        <div class="owner-nav-item" id="nav-ratings"  onclick="showTab('ratings')">Ratings</div>

        <div style="margin-top:auto;padding-top:16px;">
          <div class="owner-nav-item" onclick="doLogout()">Sign Out</div>
        </div>
      </div>

      <!-- ── Main — each tab's init() writes into here ──── -->
      <div class="owner-main" id="main-content">
        <div style="color:#7a6e5e;">Loading…</div>
      </div>

    </div>

    <script src="../js/owner/owner-core.js"></script>

    <script src="../js/owner/tab-clients.js"></script>
    <script src="../js/owner/tab-calendar.js"></script>
    <script src="../js/owner/tab-gallery.js"></script>
    <script src="../js/owner/tab-ratings.js"></script>

    <script>
      showTab(localStorage.getItem('owner_active_tab') || 'clients');
    </script>

  </body>
</html>
