<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Realized - Login</title>
    <link href="../css/login_styling.css" rel="stylesheet">
</head>
<body>
    <div class="login-box">
        <h2>Vision Realized</h2>
        
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="Username" required>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            
            <button type="submit">Login</button>
            
            <div id="message"></div>
        </form>
        
        <div class="info">
            <p>Demo: john_doe / password123</p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            messageDiv.innerHTML = 'Logging in...';
            messageDiv.className = '';
            
            try {
                const response = await fetch('http://localhost:5000/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    messageDiv.innerHTML = 'Login successful! Redirecting...';
                    messageDiv.className = 'success';
                    
                    // Store user info
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Redirect based on role
                    setTimeout(() => {
                        if (data.user.role === 'Owner') {
                            window.location.href = 'owner.html';
                        } else {
                            window.location.href = 'client.html';
                        }
                    }, 1500);
                } else {
                    messageDiv.innerHTML = data.message || 'Login failed';
                    messageDiv.className = 'error';
                }
            } catch (error) {
                messageDiv.innerHTML = 'Connection error. Make sure the server is running.';
                messageDiv.className = 'error';
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
